# ============================================
# XsusLauncher - Docker Compose
# Konfiguracja dla API i Panelu Administracyjnego
#
# OPCJONALNIE: Utwórz .env aby nadpisać domyślne wartości:
#   cp .env.example .env && nano .env
#
# Bez .env system startuje z domyślnymi ustawieniami:
#   - JWT_SECRET auto-generowany (zapisywany w data/db/.jwt_secret)
#   - Admin: admin/admin (zmień po pierwszym logowaniu)
# ============================================

services:
  # ============================================
  # BACKEND API
  # ============================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xsuslauncher-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - DATABASE_PATH=/app/data/launcher.db
      - MC_SERVER_IP=${MC_SERVER_IP:-xsus.pl}
      - MC_SERVER_PORT=${MC_SERVER_PORT:-25568}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - CURSEFORGE_API_KEY=${CURSEFORGE_API_KEY:-}
      - BACKUP_DIR=/app/data/backups
      - ADMIN_URL=${ADMIN_URL:-}
      - API_URL=${API_URL:-}
    volumes:
      # Dane persistentne
      - ./data/db:/app/data
      - ./data/uploads:/app/uploads
      - ./data/backups:/app/data/backups
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - xsuslauncher-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ============================================
  # PANEL ADMINISTRACYJNY
  # ============================================
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: xsuslauncher-admin
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - xsuslauncher-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  xsuslauncher-network:
    driver: bridge
