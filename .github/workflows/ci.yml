name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # Security audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run npm audit (high severity)
        run: npm audit --audit-level=high || true

  # ============================================
  # Backend tests
  # ============================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  # ============================================
  # Admin panel build
  # ============================================
  admin-panel:
    name: Admin Panel Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - run: npm run build

  # ============================================
  # Lint - syntax check key backend files
  # ============================================
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check key backend files
        run: |
          echo "Checking backend source files for syntax errors..."
          node -c backend/src/index.js
          node -c backend/src/config/constants.js
          node -c backend/src/config/validateEnv.js
          node -c backend/src/middleware/auth.js
          node -c backend/src/middleware/rateLimiter.js
          node -c backend/src/middleware/errorHandler.js
          node -c backend/src/utils/helpers.js
          node -c backend/src/routes/auth.js
          node -c backend/src/routes/system.js
          node -c backend/src/routes/launcher.js
          echo "All syntax checks passed."

  # ============================================
  # Docker build check
  # ============================================
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, admin-panel, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build --no-cache -t xsuslauncher-api-test ./backend
      - name: Build admin panel Docker image
        run: docker build --no-cache -t xsuslauncher-admin-test ./admin-panel

  # ============================================
  # Launcher build check
  # ============================================
  launcher-build:
    name: Launcher Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
