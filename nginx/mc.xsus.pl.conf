# ============================================
# Konfiguracja Nginx dla mc.xsus.pl
# XsusLauncher - Panel i API
# ============================================

# Przekierowanie HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mc.xsus.pl;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Przekierowanie na HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Główny serwer HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mc.xsus.pl;

    # ============================================
    # SSL - Certbot (Let's Encrypt)
    # ============================================
    ssl_certificate /etc/letsencrypt/live/mc.xsus.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc.xsus.pl/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mc.xsus.pl/chain.pem;

    # SSL settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ============================================
    # SECURITY HEADERS
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # GZIP
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ============================================
    # LIMITY
    # ============================================
    client_max_body_size 100M;

    # ============================================
    # LOGI
    # ============================================
    access_log /var/log/nginx/mc.xsus.pl.access.log;
    error_log /var/log/nginx/mc.xsus.pl.error.log;

    # ============================================
    # PANEL ADMINISTRACYJNY (główna strona)
    # ============================================
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ============================================
    # API
    # ============================================
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # ============================================
    # WEBSOCKET
    # ============================================
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ============================================
    # PLIKI STATYCZNE LAUNCHERA (do pobrania)
    # ============================================
    location /download/launcher {
        alias /opt/xsuslauncher/releases;
        autoindex off;

        # Cache headers
        add_header Cache-Control "public, max-age=3600";
    }
}
