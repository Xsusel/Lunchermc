<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Green accent gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>

    <!-- Glow gradient for the X -->
    <linearGradient id="xGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#69f0ae"/>
      <stop offset="100%" stop-color="#00bfa5"/>
    </linearGradient>

    <!-- Outer glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Inner glow for cube faces -->
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip for rounded square -->
    <clipPath id="roundClip">
      <rect width="256" height="256" rx="48" ry="48"/>
    </clipPath>
  </defs>

  <!-- Clipped container -->
  <g clip-path="url(#roundClip)">
    <!-- Background -->
    <rect width="256" height="256" fill="url(#bgGrad)"/>

    <!-- Subtle grid pattern for texture -->
    <g opacity="0.04" stroke="#fff" stroke-width="0.5">
      <line x1="0" y1="64" x2="256" y2="64"/>
      <line x1="0" y1="128" x2="256" y2="128"/>
      <line x1="0" y1="192" x2="256" y2="192"/>
      <line x1="64" y1="0" x2="64" y2="256"/>
      <line x1="128" y1="0" x2="128" y2="256"/>
      <line x1="192" y1="0" x2="192" y2="256"/>
    </g>

    <!-- Ambient light top-left corner -->
    <radialGradient id="ambientLight" cx="0.2" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
    <rect width="256" height="256" fill="url(#ambientLight)"/>

    <!-- 3D Isometric Cube (Minecraft block feel) -->
    <g transform="translate(128, 118)" filter="url(#shadow)">
      <!-- Top face -->
      <polygon points="0,-52 60,-22 0,8 -60,-22" fill="#1db954" opacity="0.9"/>
      <polygon points="0,-52 60,-22 0,8 -60,-22" fill="url(#accentGrad)" opacity="0.35"/>

      <!-- Left face -->
      <polygon points="-60,-22 0,8 0,68 -60,38" fill="#0d7a35" opacity="0.9"/>

      <!-- Right face -->
      <polygon points="60,-22 0,8 0,68 60,38" fill="#15994a" opacity="0.9"/>

      <!-- Subtle block lines on top face -->
      <g stroke="#0a5c28" stroke-width="0.8" opacity="0.4">
        <line x1="-30" y1="-37" x2="30" y2="-7"/>
        <line x1="-30" y1="-7" x2="30" y2="-37"/>
      </g>

      <!-- Block edge highlights -->
      <line x1="-60" y1="-22" x2="0" y2="-52" stroke="#69f0ae" stroke-width="1.2" opacity="0.5"/>
      <line x1="0" y1="-52" x2="60" y2="-22" stroke="#69f0ae" stroke-width="1.2" opacity="0.5"/>
    </g>

    <!-- Stylized X mark with glow -->
    <g transform="translate(128, 128)" filter="url(#glow)">
      <!-- X strokes -->
      <g stroke="url(#xGrad)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.95">
        <line x1="-32" y1="-32" x2="32" y2="32"/>
        <line x1="32" y1="-32" x2="-32" y2="32"/>
      </g>
    </g>

    <!-- Small accent dots (modern decorative) -->
    <g fill="#00e676" opacity="0.25">
      <circle cx="40" cy="40" r="3"/>
      <circle cx="216" cy="40" r="3"/>
      <circle cx="40" cy="216" r="3"/>
      <circle cx="216" cy="216" r="3"/>
    </g>

    <!-- Border ring -->
    <rect x="3" y="3" width="250" height="250" rx="46" ry="46" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>
