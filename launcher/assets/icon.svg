<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="#0a0a0a"/>

  <!-- Outer glow -->
  <rect x="16" y="16" width="224" height="224" rx="24" fill="none" stroke="#00cc66" stroke-width="4" opacity="0.3"/>

  <!-- Inner frame -->
  <rect x="32" y="32" width="192" height="192" rx="16" fill="#141414" stroke="#00cc66" stroke-width="2"/>

  <!-- Minecraft block pattern -->
  <g fill="#00cc66" opacity="0.8">
    <!-- Top row -->
    <rect x="56" y="56" width="32" height="32" rx="4"/>
    <rect x="112" y="56" width="32" height="32" rx="4"/>
    <rect x="168" y="56" width="32" height="32" rx="4"/>

    <!-- Middle row -->
    <rect x="56" y="112" width="32" height="32" rx="4"/>
    <rect x="168" y="112" width="32" height="32" rx="4"/>

    <!-- Bottom row -->
    <rect x="56" y="168" width="32" height="32" rx="4"/>
    <rect x="112" y="168" width="32" height="32" rx="4"/>
    <rect x="168" y="168" width="32" height="32" rx="4"/>
  </g>

  <!-- Center X -->
  <g stroke="#00ff66" stroke-width="6" stroke-linecap="round">
    <line x1="104" y1="104" x2="152" y2="152"/>
    <line x1="152" y1="104" x2="104" y2="152"/>
  </g>
</svg>
